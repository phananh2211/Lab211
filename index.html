<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/211.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab211 - Hệ Thống Quản Lý Phòng Thí Nghiệm</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Google Translate Widget ẩn để điều khiển ngôn ngữ nhanh -->
    <div id="google_translate_element" style="display: none;"></div>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'vi',
          includedLanguages: 'en,vi',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'google_translate_element');
      }

      // Hàm gọi chuyển đổi ngôn ngữ toàn cục có tích hợp cơ chế chờ (retry)
      window.changeLanguage = function(langCode, retryCount = 0) {
        var selectField = document.querySelector(".goog-te-combo");
        if (selectField) {
          selectField.value = langCode;
          selectField.dispatchEvent(new Event('change'));
        } else if (retryCount < 10) {
          // Nếu Google Translate chưa tải xong select, đợi 300ms rồi thử lại tối đa 10 lần
          setTimeout(function() {
            window.changeLanguage(langCode, retryCount + 1);
          }, 300);
        } else {
          console.warn("Google Translate chưa sẵn sàng để chuyển ngôn ngữ.");
        }
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
